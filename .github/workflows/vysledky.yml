name: Výsledky z ceskyflorbal.cz
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths: ['tools/cf.py', '.github/workflows/vysledky.yml']
permissions:
  contents: write
concurrency:
  group: vysledky
  cancel-in-progress: false
jobs:
  cf:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in https://fis.ceskyflorbal.cz/ "https://fis.ceskyflorbal.cz/index.php?pageid=2519&onlycontent=1" https://mcr.ceskyflorbal.cz/ https://eft.ceskyflorbal.cz/ https://superfinale.ceskyflorbal.cz/ https://www.ceskyflorbal.cz/robots.txt; do echo "DIAG $u $(curl -s -o /dev/null -w '%{http_code} %{remote_ip}' -A 'Mozilla/5.0' "$u")"; done
        continue-on-error: true
      - run: pip install -q curl_cffi
      - run: python3 tools/cf.py
